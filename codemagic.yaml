workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CodeMagicKey
    
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tennisgpt.app
      vars:
        API_BASE_URL: "https://tennisgpt-production.up.railway.app"
    
    scripts:
      - name: Create .env file
        script: |
          echo "API_BASE_URL=$API_BASE_URL" > .env
          cat .env
      
      - name: Install dependencies
        script: flutter pub get
      
      - name: Install CocoaPods
        script: cd ios && pod install
      
      - name: Generate unique build number
        script: |
          # Use timestamp for guaranteed unique build number (YYMMDDHHM format)
          BUILD_NUMBER=$(date +%y%m%d%H%M)
          echo "Generated build number: $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV
      
      - name: Build iOS IPA
        script: |
          echo "Building with build number: $BUILD_NUMBER"
          EXTRA_ARGS=""
          if [ -n "$REVENUECAT_APPLE_KEY" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dart-define=REVENUECAT_APPLE_KEY=$REVENUECAT_APPLE_KEY"
          fi
          if [ -n "$REVENUECAT_GOOGLE_KEY" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dart-define=REVENUECAT_GOOGLE_KEY=$REVENUECAT_GOOGLE_KEY"
          fi
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            $EXTRA_ARGS \
            --export-options-plist=/Users/builder/export_options.plist
    
    artifacts:
      - build/ios/ipa/*.ipa
    
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
