workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CodeMagicKey
    
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tennisgpt.app
      vars:
        API_BASE_URL: "https://tennisgpt-production.up.railway.app"
    
    scripts:
      - name: Create .env file
        script: |
          echo "API_BASE_URL=$API_BASE_URL" > .env
          cat .env
      
      - name: Install dependencies
        script: flutter pub get
      
      - name: Install CocoaPods
        script: cd ios && pod install
      
      - name: Get latest build number from App Store Connect
        script: |
          # Fetch the latest build number and increment by 1
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number com.tennisgpt.app || echo "0")
          echo "Latest build number: $LATEST_BUILD"
          NEW_BUILD=$((LATEST_BUILD + 1))
          echo "New build number: $NEW_BUILD"
          echo "BUILD_NUMBER=$NEW_BUILD" >> $CM_ENV
      
      - name: Build iOS IPA
        script: |
          echo "Building with build number: $BUILD_NUMBER"
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    
    artifacts:
      - build/ios/ipa/*.ipa
    
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
