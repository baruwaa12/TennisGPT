[phases.setup]
nixPkgs = ["dotnet-sdk_9"]

[phases.build]
cmds = ["dotnet publish TennisGPT.Api/TennisGPT.Api.csproj -c Release -o /app/publish"]

[start]
cmd = "cd /app/publish && dotnet TennisGPT.Api.dll"

[variables]
ASPNETCORE_URLS = "http://0.0.0.0:${PORT:-8080}"
ASPNETCORE_ENVIRONMENT = "Production"

